name: gold-news-24h
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-bot-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: News and status
        run: python news.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save news state
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news_state.json
          git diff --cached --quiet || (git commit -m "update news state" && git pull --rebase && git push)
      - name: Notify Telegram about workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t,c=os.getenv("TELEGRAM_TOKEN"),os.getenv("TELEGRAM_CHAT_ID")
          if t and c:
              requests.post(f"https://api.telegram.org/bot{t}/sendMessage",data={"chat_id":c,"text":"⚠️ Gold News workflow failed. GitHub Actions run log দেখুন।"},timeout=20).raise_for_status()
          PY
