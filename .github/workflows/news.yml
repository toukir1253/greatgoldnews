name: gold-news-and-status
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-news-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run news and market status
        id: news
        run: python news.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save news state
        if: always() && steps.news.outcome == 'success'
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news_state.json
          git diff --cached --quiet || (git commit -m "update news state" && git pull --rebase && git push)
      - name: Telegram failure alert
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token, chat = os.getenv("TELEGRAM_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if token and chat:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat, "text": "⚠️ Gold News workflow failed. GitHub Actions log দেখুন।"},
                  timeout=20,
              )
              response.raise_for_status()
          PY
