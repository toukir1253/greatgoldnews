name: gold-bot

on:
  schedule:
    - cron: "*/10 23 * * 0-4"   # 05:00-05:59 Bangladesh time, Monday-Friday
    - cron: "*/10 0-17 * * 1-5" # 06:00-23:59 Bangladesh time, Monday-Friday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trade signals
        continue-on-error: true
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update trade state" && git pull --rebase && git push)
