name: gold-signal-bot
on:
  schedule:
    # Bangladesh 05:00–23:50, Monday–Friday (UTC 23:00 previous day + 00:00–17:50)
    - cron: "*/10 23 * * 0-4"
    - cron: "*/10 0-17 * * 1-5"
  workflow_dispatch:
    inputs:
      manual_signal:
        description: "Run a user-requested /signal check"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: gold-bot-shared-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V2.3 signal engine
        id: bot
        run: |
          if [ "$MANUAL_SIGNAL" = "true" ]; then
            python bot.py --manual
          else
            python bot.py
          fi
        env:
          MANUAL_SIGNAL: ${{ inputs.manual_signal }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save signal state
        if: always() && steps.bot.outcome == 'success'
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if [ -f calendar_cache.json ]; then git add calendar_cache.json; fi
          git diff --cached --quiet || (git commit -m "update V2.3 signal state" && git pull --rebase && git push)
      - name: Telegram failure alert
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token, chat = os.getenv("TELEGRAM_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if token and chat:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat, "text": "⚠️ Gold Signal Bot V2.3 failed. GitHub Actions log দেখুন।"},
                  timeout=20,
              )
              response.raise_for_status()
          PY
